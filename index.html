<style>
  :root {
    --paper: #121212;
    --ink: #ECEAE5;
    --muted: #8C8C8C;
    --button: #1C1C1C;
    --button-hover: #222222;
    --progress: #2C2C2C;
    --tip: #0A0A0A;
    --accent: #E24B4A;
  }
  /* Theme crossfade. --tms is 0 at rest so nothing animates on load; html.theming sets it
     for the duration of a switch. Hover/press timings keep their own faster values. */
  :root { --tms: 0ms; }
  html.theming { --tms: 700ms; }
  /* Day: Apple's light system palette. */
  :root[data-theme="day"] {
    --paper: #F2F2F7;          /* systemGroupedBackground */
    --ink: #1C1C1E;            /* near-black; no true black anywhere */
    --muted: #8E8E93;          /* systemGray */
    --button: #E5E5EA;         /* systemGray5 */
    --button-hover: #D1D1D6;   /* systemGray4 */
    --progress: #C7C7CC;       /* systemGray3 */
    --tip: #1C1C1E;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    transition: background-color var(--tms) ease-in-out, color var(--tms) ease-in-out;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }
  .clock {
    /* 180 viewBox units at 1.2px per unit: numerals (10 units) render at 12px. */
    width: 216px;
    height: auto;
    display: block;
  }
  .clock .numeral {
    font-family: inherit;
    font-size: 10px;
    fill: var(--muted);
    text-anchor: middle;
  }
  .clock .hub, .clock .hand { fill: var(--ink); transition: fill var(--tms) ease-in-out; }
  .clock .numeral { transition: fill var(--tms) ease-in-out; }
  .clock .seconds {
    stroke: var(--accent);
    stroke-width: 1.2;
    stroke-linecap: round;
    fill: none;
  }
  .controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: calc(32px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .controls button {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    font: inherit;
    font-size: 10px;
    line-height: 1;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--button);
    border: 0;
    border-radius: 999px;
    padding: 5px 8px;
    cursor: pointer;
    transition: color var(--btn-ms, 150ms) ease-in-out, background-color var(--btn-ms, 150ms) ease-in-out;
  }
  html.theming .controls button { --btn-ms: 700ms; }
  .controls button:hover { color: var(--ink); background: var(--button-hover); }
  /* While auto-cycling, the active button's fill sweeps left→right as a countdown. */
  .controls button::before {
    content: "";
    position: absolute;
    inset: 0;
    width: calc(var(--p, 0) * 100%);
    background: var(--progress);
    pointer-events: none;
    transition: background-color var(--tms) ease-in-out;
  }
  .controls:not(.cycling) button::before { display: none; }
  /* Wordmark, top-left. "ments" in Inter Medium 14.4px; the three mark glyphs in Noto Sans
     Symbols 2 (subset to ● and ◗), scaled to sit on Inter's x-height. */
  .wordmark {
    position: fixed;
    top: calc(32px + env(safe-area-inset-top, 0px));
    left: 32px;
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 500;
    font-size: 14.4px;
    line-height: 1;
    color: var(--ink);
    user-select: none;
    transition: color var(--tms) ease-in-out;
  }
  .wordmark .mark {
    font-family: "Noto Sans Symbols 2", "Apple Symbols", "DejaVu Sans", sans-serif;
    font-weight: 400;
    font-size: 72%;
  }
  /* AM/PM switch: a vertical capsule, AM above PM, a pill slides behind the selected one. */
  .theme {
    position: fixed;
    top: calc(32px + env(safe-area-inset-top, 0px));
    right: 32px;
    display: flex;
    flex-direction: column;
    padding: 3px;
    background: var(--button);
    border-radius: 14px;
    transition: background-color var(--tms) ease-in-out;
  }
  .theme-pill {
    position: absolute;
    left: 3px;
    right: 3px;
    top: 3px;
    height: calc(50% - 3px);
    border-radius: 11px;
    background: var(--progress);
    transform: translateY(100%);
    transition: transform 260ms cubic-bezier(0.65, 0, 0.35, 1),
                background-color var(--tms) ease-in-out;
  }
  .theme.day .theme-pill { transform: translateY(0); }
  .theme button {
    position: relative;
    font: inherit;
    font-size: 10px;
    line-height: 1;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 11px;
    padding: 6px 8px;
    cursor: pointer;
    transition: color var(--btn-ms, 150ms) ease-in-out;
  }
  html.theming .theme button { --btn-ms: 700ms; }
  .theme button:hover, .theme button[aria-pressed="true"] { color: var(--ink); }
  .theme button:focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .theme-pill { transition: none; } }
  .controls button > * { position: relative; }
  /* Weather tooltip on the city buttons: quiet pill above, tail pointing down.
     Empty until the forecast has loaded; hover-only so touch never sticks. */
  .controls li { position: relative; }
  .controls .tip {
    position: absolute;
    left: 50%;
    bottom: calc(100% + 10px);
    transform-origin: 50% calc(100% + 3px);
    transform: translate(-50%, 4px) scale(0.94);
    padding: 4px 7px;
    border-radius: 999px;
    background: var(--tip);
    color: var(--muted);
    font-size: 10px;
    line-height: 1;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 120ms ease, transform 120ms ease,
                background-color var(--tms) ease-in-out, color var(--tms) ease-in-out;
  }
  .controls .tip:empty { display: none; }
  .controls .tip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    margin-left: -3px;
    border: 3px solid transparent;
    border-top-color: var(--tip);
    border-bottom: 0;
    transition: border-top-color var(--tms) ease-in-out;
  }
  @media (hover: hover) {
    .controls li:hover .tip,
    .controls button:focus-visible + .tip {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
      transition: opacity 220ms ease 180ms,
                  transform 300ms cubic-bezier(0.2, 1.15, 0.4, 1) 180ms,
                  background-color var(--tms) ease-in-out, color var(--tms) ease-in-out;
    }
  }
  @media (prefers-reduced-motion: reduce) { .controls .tip { transition: none; } }
  /* Selected-state marker: a terminal-style dot that slides open before the label. */
  .controls .dot {
    display: block;
    flex: none;
    width: 0;
    height: 5px;
    margin-right: 0;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    transition: width 260ms cubic-bezier(0.65, 0, 0.35, 1),
                margin-right 260ms cubic-bezier(0.65, 0, 0.35, 1),
                opacity 200ms ease;
  }
  .controls button[aria-pressed="true"] .dot {
    width: 5px;
    margin-right: 8px;
    opacity: 1;
  }
  @media (prefers-reduced-motion: reduce) {
    .controls .dot { transition: none; }
  }
  /* Phones: everything a step larger. Clock at 1.4px per unit → numerals 14px. */
  @media (max-width: 600px) {
    .clock { width: 252px; }
    .controls { gap: 8px; }
    .controls button { font-size: 12px; padding: 7px 10px; }
    .theme button { font-size: 12px; padding: 7px 10px; }
    .controls .dot { height: 6px; }
    .controls button[aria-pressed="true"] .dot { width: 6px; margin-right: 10px; }
  }
  .controls button:focus-visible {
    outline: 1px solid var(--ink);
    outline-offset: 2px;
  }
</style>
</head>

<script>
(function () {
  'use strict';

  // --- Elements -------------------------------------------------------------
  var hourEl    = document.getElementById('hour');
  var minuteEl  = document.getElementById('minute');
  var secondsEl = document.getElementById('seconds');
  var buttons   = Array.prototype.slice.call(document.querySelectorAll('.controls button'));
  var controlsEl = document.getElementById('controls');
  var themeEl   = document.getElementById('theme');
  var themeBtns = Array.prototype.slice.call(themeEl.querySelectorAll('button'));

  // --- Constants (decision 0003) --------------------------------------------
  var LOCAL_ZONE = Intl.DateTimeFormat().resolvedOptions().timeZone;
  var TWEEN_MS = 1100;
  var CYCLE_MS = 5000;                   // auto-cycle period between buttons
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  // --- Time reading ---------------------------------------------------------
  var formatters = {};
  function formatterFor(zone) {
    if (!formatters[zone]) {
      formatters[zone] = new Intl.DateTimeFormat('en-GB', {
        timeZone: zone, hourCycle: 'h23',
        hour: 'numeric', minute: 'numeric', second: 'numeric'
      });
    }
    return formatters[zone];
  }

  // Returns { h, m, s } with s fractional (milliseconds included).
  function readTime(zone, now) {
    if (zone === 'ODD') return { h: 3, m: 15, s: 0 };
    var parts = formatterFor(zone).formatToParts(new Date(now));
    var t = { h: 0, m: 0, s: 0 };
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (p.type === 'hour')   t.h = parseInt(p.value, 10);
      if (p.type === 'minute') t.m = parseInt(p.value, 10);
      if (p.type === 'second') t.s = parseInt(p.value, 10);
    }
    t.s += (now % 1000) / 1000;
    return t;
  }

  // --- Angles (decision 0003) -----------------------------------------------
  function anglesFor(zone, now) {
    var t = readTime(zone, now);
    if (zone === 'ODD') {
      // Snapped: hour hand at exactly 0 so the mark lands horizontal.
      return { h: 0, m: (t.m + t.s / 60) * 6 - 90, s: t.s * 6 };
    }
    return {
      h: ((t.h % 12) + t.m / 60) * 30 - 90,
      m: (t.m + t.s / 60) * 6 - 90,
      s: t.s * 6
    };
  }

  // Always-clockwise forward delta, 0 <= d < 360.
  function forward(target, current) {
    return ((target - current) % 360 + 360) % 360;
  }

  function easeInOutCubic(x) {
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }

  // --- State ----------------------------------------------------------------
  var selected = 'local';                // which button is pressed: 'local', a zone id, or 'ODD'
  var zone = LOCAL_ZONE;                 // the zone that selection resolves to
  var cur = { h: 0, m: 0, s: 0 };        // displayed angles, unwrapped, monotonically increasing
  var tween = null;                      // { start:{h,m,s}, delta:{h,m,s}, base:{h,m,s}, t0 }
  var cycling = true;                    // auto-cycle until the visitor clicks a button
  var cycleT0 = performance.now();       // when the current button became active

  (function init() {
    var a = anglesFor(zone, Date.now());
    cur = { h: a.h, m: a.m, s: a.s };
  })();

  function render() {
    hourEl.setAttribute('transform',    'rotate(' + cur.h + ' 90 90)');
    minuteEl.setAttribute('transform',  'rotate(' + cur.m + ' 90 90)');
    secondsEl.setAttribute('transform', 'rotate(' + cur.s + ' 90 90)');
  }

  // Advance the displayed angles to the live target, always moving forward.
  function stepLive(now) {
    var a = anglesFor(zone, now);
    cur.h += forward(a.h, cur.h);
    cur.m += forward(a.m, cur.m);
    cur.s += forward(a.s, cur.s);
  }

  function activeButton() {
    for (var i = 0; i < buttons.length; i++) {
      if (buttons[i].dataset.zone === selected) return buttons[i];
    }
    return null;
  }

  function stepCycle(now) {
    var p = Math.min(1, (now - cycleT0) / CYCLE_MS);
    var active = activeButton();
    if (active) active.style.setProperty('--p', p);
    if (p >= 1) {
      if (active) active.style.removeProperty('--p');
      var i = buttons.indexOf(active);
      setZone(buttons[(i + 1) % buttons.length].dataset.zone);
      cycleT0 = now;
    }
  }

  function stopCycling() {
    if (!cycling) return;
    cycling = false;
    controlsEl.classList.remove('cycling');
    buttons.forEach(function (b) { b.style.removeProperty('--p'); });
  }

  function frame(now) {
    if (cycling) stepCycle(now);
    if (tween) {
      // Wind the captured delta, and add however far live time has moved since the
      // wind began, so the seconds hand keeps sweeping and the hands land exactly
      // on the live target with no catch-up jump.
      var p = Math.min(1, (now - tween.t0) / TWEEN_MS);
      var e = easeInOutCubic(p);
      var live = anglesFor(zone, Date.now());
      cur.h = tween.start.h + tween.delta.h * e + forward(live.h, tween.base.h);
      cur.m = tween.start.m + tween.delta.m * e + forward(live.m, tween.base.m);
      cur.s = tween.start.s + tween.delta.s * e + forward(live.s, tween.base.s);
      if (p >= 1) tween = null;
    } else {
      stepLive(Date.now());
    }
    render();
    window.requestAnimationFrame(frame);
  }

  // --- Zone switching -------------------------------------------------------
  // Buttons carry a key; "local" stands for the visitor's own zone. Selection is
  // tracked by key, not by resolved zone, so YOU and a city that happens to be the
  // visitor's own zone never light up together.
  function markPressed() {
    buttons.forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.zone === selected ? 'true' : 'false');
    });
  }

  function setZone(key) {
    selected = key;
    zone = key === 'local' ? LOCAL_ZONE : key;
    markPressed();
    var a = anglesFor(zone, Date.now());
    var delta = {
      h: forward(a.h, cur.h),
      m: forward(a.m, cur.m),
      s: forward(a.s, cur.s)
    };

    if (reduceMotion.matches) {
      cur.h += delta.h; cur.m += delta.m; cur.s += delta.s;
      tween = null;
      return;
    }
    tween = { start: { h: cur.h, m: cur.m, s: cur.s }, delta: delta, base: a, t0: performance.now() };
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () {
      stopCycling();
      var key = b.dataset.zone;
      setZone(key === selected ? 'local' : key);
    });
  });

  // --- AM / PM (light / dark) -----------------------------------------------
  var themingTimer = null;
  function applyTheme(theme, animate) {
    var day = theme === 'day';
    if (animate) {
      document.documentElement.classList.add('theming');
      clearTimeout(themingTimer);
      themingTimer = setTimeout(function () {
        document.documentElement.classList.remove('theming');
      }, 750);
    }
    if (day) document.documentElement.setAttribute('data-theme', 'day');
    else document.documentElement.removeAttribute('data-theme');
    themeEl.classList.toggle('day', day);
    themeBtns.forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.theme === theme ? 'true' : 'false');
    });
    try { localStorage.setItem('oddments-theme', theme); } catch (e) {}
  }
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('oddments-theme'); } catch (e) {}
  applyTheme(savedTheme === 'day' ? 'day' : 'night');
  themeBtns.forEach(function (b) {
    b.addEventListener('click', function () { applyTheme(b.dataset.theme, true); });
  });

  // --- Weather (Open-Meteo, no key) -----------------------------------------
  // One request for all three cities, refreshed every 15 minutes. Tooltip stays
  // empty (and hidden) until data arrives or if the request fails.
  var WEATHER_MS = 15 * 60 * 1000;
  var cityButtons = buttons.filter(function (b) { return b.dataset.lat; });
  function weatherWord(code) {
    if (code === 0 || code === 1) return 'Clear';
    if (code === 2) return 'Cloudy';
    if (code === 3) return 'Overcast';
    if (code === 45 || code === 48) return 'Fog';
    if (code >= 51 && code <= 57) return 'Drizzle';
    if (code >= 61 && code <= 67) return 'Rain';
    if (code >= 71 && code <= 77) return 'Snow';
    if (code >= 80 && code <= 82) return 'Showers';
    if (code === 85 || code === 86) return 'Snow';
    if (code >= 95) return 'Thunder';
    return '';
  }
  function loadWeather() {
    if (!cityButtons.length || !window.fetch) return;
    var lat = cityButtons.map(function (b) { return b.dataset.lat; }).join(',');
    var lon = cityButtons.map(function (b) { return b.dataset.lon; }).join(',');
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
              '&current=temperature_2m,weather_code&temperature_unit=celsius';
    fetch(url).then(function (r) { return r.ok ? r.json() : null; }).then(function (data) {
      if (!data) return;
      var list = Array.isArray(data) ? data : [data];
      cityButtons.forEach(function (b, i) {
        var d = list[i], tip = b.nextElementSibling;
        if (!d || !d.current || !tip) return;
        var c = d.current.temperature_2m;
        var t = b.dataset.unit === 'fahrenheit' ? Math.round(c * 9 / 5 + 32) : Math.round(c);
        var w = weatherWord(d.current.weather_code);
        tip.textContent = t + '\u00B0' + (w ? ' ' + w : '');
      });
    }).catch(function () {});
  }
  loadWeather();
  setInterval(loadWeather, WEATHER_MS);

  markPressed();
  render();
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
